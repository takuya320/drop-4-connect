name: Audit

# Kept separate from CI: advisories appear independently of code changes, so
# this must not block merges (it is not a required check). Failures surface
# as a red run here and via the scheduled run.
on:
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/audit.yml
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: pnpm audit --audit-level=high
