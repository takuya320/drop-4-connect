version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "typescript"
        versions:
          - ">=7.0.0"
    groups:
      all-dependencies:
        patterns:
          - "*"
